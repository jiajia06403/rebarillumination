name: CI-Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar
        env:
          GRADLE_OPTS: "-Xmx4G"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebarIllumination
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: RebarIllumination
          path: build/libs

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.extract_version.outputs.VERSION }}
          body: |
            ## Rebar Illumination v${{ steps.extract_version.outputs.VERSION }}
            
            ### Changes
            
            - See commit history for details
            
            ### Requirements
            
            - Minecraft: 1.21.1
            - Rebar: 0.40.0-26.1+
            - Pylon: 0.38.0-26.1+
            
            ### Installation
            
            1. Place `RebarIllumination-${{ steps.extract_version.outputs.VERSION }}.jar` in your server's `plugins` directory
            2. Restart your server
            
            ### Features
            
            - 5 Lamp Types: Block Lamps, Pillar Lamps, Sphere Lamps, Wall Lamps, Bar Lamps
            - 16 Colors: Supports all 16 Minecraft dye colors
            - Interactive Control: Sneak + Right Click to toggle lamp state
            - Faulty Mode: Lamps can enter faulty mode, fixable with Illumar
            - Research System: Integrated with Rebar's research system
            
            ### Note
            
            All lamps require DynamicLight plugin or shader pack to emit light
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: build/libs/RebarIllumination-${{ steps.extract_version.outputs.VERSION }}.jar
          asset_name: RebarIllumination-${{ steps.extract_version.outputs.VERSION }}.jar
          asset_content_type: application/java-archive
